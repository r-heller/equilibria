format:
  html:
    # Theme, palette and typography from CTTIR/courses (assets/_shared.scss,
    # assets/light.scss, assets/dark.scss); styles.scss adds the components
    # #courses does not have. Fonts are self-hosted (assets/fonts/).
    # Dark first, as on CTTIR/courses: dark is the default scheme and the
    # toggle icons in assets/_shared.scss assume that order.
    theme:
      dark: [darkly, assets/dark.scss, styles.scss]
      light: [flatly, assets/light.scss, styles.scss]
    css: assets/fonts/fonts.css
    toc: true
    toc-depth: 3
    toc-location: right
    code-fold: false
    code-tools: true
    code-link: true
    code-copy: true
    fig-cap-location: bottom
    tbl-cap-location: top
    citations-hover: true
    crossrefs-hover: true
    link-external-newwindow: true
    include-in-header:
      - text: |
          <script>
            (function () {
              try {
                if (!localStorage.getItem('quarto-color-scheme')) {
                  localStorage.setItem('quarto-color-scheme', 'dark');
                }
                if (localStorage.getItem('quarto-color-scheme') === 'dark') {
                  document.documentElement.classList.add('quarto-dark');
                  document.documentElement.classList.remove('quarto-light');
                }
              } catch (e) {}
            })();
          </script>
      - file: _includes/vgwort.html
      - file: _includes/analytics.html
    include-before-body:
      - file: _includes/live-counts.html

bibliography: references.bib

execute:
  freeze: auto
  warning: false
  error: false      # A failed executable example must fail the build.
  message: false
