project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "courses/**/*.qmd"
    - "tutorials/**/*.qmd"
    - "shiny/**/*.qmd"
    - "appendices/**/*.qmd"
    - "decision-tree/**/*.qmd"
  resources:
    - "data/**"
    - "artifacts/**"
    - "assets/**"
    - ".nojekyll"
    - "LICENSE"
    - "LICENSE-CODE.md"

quarto-required: ">=1.9.37"

