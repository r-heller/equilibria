name: Build site
on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.19

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::tidyverse
            any::here
            any::knitr
            any::kableExtra
            any::plotly
            any::scales
            any::yaml
            any::jsonlite
            any::gridExtra
            any::R6
            any::deSolve
            any::fredr
            any::igraph
            any::lpSolve
            any::shiny
            any::downlit
            any::xml2
            any::httr2
            any::reticulate
            any::WDI
            any::combinat
            any::patchwork

      - name: Build artifacts
        run: Rscript R/build_artifacts.R

      - name: Build decision tree
        run: Rscript R/build_decision_tree.R

      - name: Check source references
        run: python3 scripts/check-source-refs.py

      - name: Check course layer
        run: Rscript R/build_courses.R --check

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check teaching algorithms
        run: |
          node tests/test_search.mjs
          python3 -m unittest discover -s tests
          Rscript tests/test_tutorial_regressions.R
          Rscript tests/test_nash_2x2.R
          Rscript tests/test_pairwise_matching.R
          Rscript tests/test_ce_entropy.R
          Rscript tests/test_combinatorial.R
          Rscript tests/test_doi_status.R

      - name: Render site
        run: quarto render

      - name: Build Pagefind index
        run: bash scripts/build_pagefind.sh

      - name: Check rendered navigation
        run: python3 scripts/check-html-links.py _site /tmp/equilibria-links.json --base-path /equilibria/

      - name: Upload site preview
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: _site/
          retention-days: 7
