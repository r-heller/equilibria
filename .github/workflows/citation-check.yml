name: Citation verification
on:
  pull_request:
    paths:
      - 'references.bib'
      - 'scripts/check-dois.R'
      - 'tests/test_doi_status.R'
      - '.github/workflows/citation-check.yml'
jobs:
  citations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::httr2
      - name: Check resolver failure handling
        run: Rscript tests/test_doi_status.R
      - name: Verify DOI registrations
        run: Rscript scripts/check-dois.R
