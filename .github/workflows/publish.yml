name: Publish site
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Legal-readiness gate
        run: |
          test -s impressum.qmd && test -s datenschutz.qmd
          if grep -Eq 'TODO_IMPRESSUM|TODO_DATENSCHUTZ' impressum.qmd datenschutz.qmd; then
            echo "::error::Publication details are incomplete — refusing to deploy"
            exit 1
          fi

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.19

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::tidyverse
            any::here
            any::knitr
            any::kableExtra
            any::plotly
            any::scales
            any::yaml
            any::jsonlite
            any::reticulate
            any::gridExtra
            any::R6
            any::deSolve
            any::dplyr
            any::fredr
            any::ggplot2
            any::igraph
            any::lpSolve
            any::tidyr
            any::shiny
            any::downlit
            any::xml2
            any::patchwork
            any::combinat
            any::httr2
            any::WDI

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r python/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check source references
        run: python3 scripts/check-source-refs.py

      - name: Check teaching algorithms
        run: |
          node tests/test_search.mjs
          python3 -m unittest discover -s tests
          Rscript tests/test_tutorial_regressions.R
          Rscript tests/test_nash_2x2.R
          Rscript tests/test_pairwise_matching.R
          Rscript tests/test_ce_entropy.R
          Rscript tests/test_combinatorial.R
          Rscript tests/test_doi_status.R

      - name: Build inventories
        run: |
          Rscript R/build_artifacts.R
          Rscript R/build_decision_tree.R
          python3 scripts/check-source-refs.py

      - name: Render site
        uses: quarto-dev/quarto-actions/render@v2

      - name: Build Pagefind index
        run: bash scripts/build_pagefind.sh

      - name: Check rendered navigation
        run: python3 scripts/check-html-links.py _site /tmp/equilibria-links.json --base-path /equilibria/

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
