# courses.yml — the four courses and the topic areas each one contains.
#
# Every slug in _data/topics.yml belongs to exactly one course; the order
# of `topics` is the reading order inside the course. The tutorials stay
# where they are (tutorials/<topic>/<tutorial>/), so no URL changes when a
# topic moves between courses.
#
# scripts/build_courses.py turns this file and _data/topics.yml into
# index.qmd, courses/<slug>/index.qmd, courses/<slug>/contents.qmd and the
# course line in each topic page's hero. Edit here, then run
#   python3 scripts/build_courses.py
# tests/test_courses.py fails when the generated pages are out of date.

courses:
  - slug: course1-game-theory
    number: 1
    level: Introductory
    title: "Foundations of Game Theory"
    nav: "Course 1 — Game Theory"
    blurb: "Equilibrium concepts and the canonical games, decisions under uncertainty, evolutionary, cooperative, behavioural and network games, and the history behind them."
    lead: "The formal core of game theory and the canonical games, worked through in R. Everything else on the site builds on it."
    outcomes:
      - "Model a strategic situation as a game and find its pure and mixed Nash equilibria."
      - "Recognise the canonical games (Prisoner's Dilemma, Hawk-Dove, coordination, bargaining, oligopoly) in new settings."
      - "Compare expected-utility, prospect-theory and ambiguity-averse decisions under uncertainty."
      - "Simulate replicator dynamics and identify evolutionarily stable strategies."
      - "Compute the Shapley value, the core and the nucleolus of a cooperative game."
      - "Contrast equilibrium predictions with bounded-rationality models such as QRE and level-k."
      - "Analyse strategic network formation, and place the field's results in their history."
    audience: "Start here if game theory is new to you. The course assumes basic R (reading data, writing a function, drawing a ggplot2 plot) and school-level algebra."
    topics:
      - foundations
      - classical-games
      - decision-theory
      - evolutionary-gt
      - cooperative-gt
      - behavioral-gt
      - network-games
      - history-of-gt-mathematics

  - slug: course2-mechanisms-behaviour
    number: 2
    level: Intermediate
    title: "Mechanisms, Behaviour & Ethics"
    nav: "Course 2 — Mechanisms & Behaviour"
    blurb: "Designing the rules of the game, auctions, behaviour in the lab and the field, incentives in blockchains, ethics, and cases where theory meets reality."
    lead: "How rules shape outcomes, how people actually play, and what follows ethically: from auctions and matching to blockchains, experiments and historical cases."
    outcomes:
      - "Design mechanisms (VCG, matching, voting rules) and check whether they are incentive compatible."
      - "Work through revenue equivalence, Myerson's optimal auction, combinatorial auctions and GSP."
      - "Apply prospect theory, heuristics, nudges and time preferences to observed choices."
      - "Read and replicate classic laboratory and field experiments."
      - "Analyse blockchain incentives, MEV and DeFi protocols as games."
      - "Formalise ethical dilemmas and assess fairness in algorithmic and policy settings."
      - "Connect the theory to cases such as the Cold War, OPEC, climate negotiations and market design."
    audience: "For readers who know Nash equilibrium and the canonical games from Course 1 and want to apply them to markets, institutions and behaviour."
    topics:
      - mechanism-design
      - auction-theory-deep-dive
      - behavioral-economics
      - experimental-economics
      - cryptography-and-gt
      - ethics-and-game-theory
      - ethics-applications
      - case-studies

  - slug: course3-methods
    number: 3
    level: Advanced
    title: "Mathematical & Statistical Methods"
    nav: "Course 3 — Methods"
    blurb: "Linear algebra, optimisation, information theory, statistics, Bayesian and causal inference, econometrics and network science: the toolkit behind the models."
    lead: "The mathematics and statistics the models rest on, each implemented in R."
    outcomes:
      - "Use eigenvalues, the SVD and graph Laplacians to analyse the matrices that arise in games and networks."
      - "Solve linear and dynamic programmes and compute fixed points numerically."
      - "Quantify information with entropy, mutual information and KL divergence."
      - "Carry out frequentist inference, regression and nonparametric tests."
      - "Fit Bayesian models with conjugate priors and MCMC."
      - "Estimate causal effects with DAGs, difference-in-differences, instrumental variables, regression discontinuity and synthetic control."
      - "Model time series with ARIMA, VAR and GARCH, and analyse random graphs, centrality and communities."
    audience: "For readers who want the methods behind the models. Courses 1 and 2 supply the examples but are not required; comfort with R and algebra is."
    topics:
      - linear-algebra-matrix
      - optimization-numerical-methods
      - information-theory
      - statistical-foundations
      - bayesian-methods
      - causal-inference
      - time-series-econometrics
      - network-science

  - slug: course4-simulation-ai-data
    number: 4
    level: Specialist
    title: "Simulation, AI & Data Practice"
    nav: "Course 4 — Simulation, AI & Data"
    blurb: "Monte Carlo and agent-based simulation, machine learning and multi-agent AI, public data, visualisation, reproducible workflows and R packages."
    lead: "Simulating strategic systems, learning agents, working with live data, and publishing the analysis as reproducible, documented R code."
    outcomes:
      - "Build Monte Carlo and agent-based simulations and run tournaments between strategies."
      - "Explain how AlphaZero, counterfactual regret minimisation and multi-agent reinforcement learning relate to game theory."
      - "Trace machine learning from the perceptron to transformers, with R implementations."
      - "Retrieve data from public sources such as the World Bank, ACLED, NOAA and arXiv for game-theoretic analysis."
      - "Produce publication-ready figures, interactive plots, game trees and network graphs."
      - "Make an analysis reproducible with Quarto, renv, targets and Docker, and package it with roxygen2, testthat and pkgdown."
    audience: "For readers who already write R and want to simulate, learn from data, and publish their work reproducibly."
    topics:
      - simulations
      - ml-and-gt
      - ai-ml-foundations-and-applications
      - public-apis-and-datasets
      - real-world-data-applications
      - visualization-and-communication
      - reproducibility-open-science
      - r-package-development
