<script>
// live-counts.html — populates [data-topic-count], [data-topic-sum] (a
// space-separated list of topic slugs, used for course totals) and
// #live-total-count spans from artifacts/graph.json in the browser.
// A span inside a .count-chip hides the whole chip when it has no number.
// Fails silently (hides the span) if the CSV is unreachable, keeping
// pages free of empty "(undefined)" numerals.
(function() {
  async function fetchGraph() {
    const candidates = [
      'artifacts/graph.json',
      '../artifacts/graph.json',
      '../../artifacts/graph.json',
      '../../../artifacts/graph.json',
    ];
    for (const path of candidates) {
      try {
        const r = await fetch(path);
        if (r.ok) return await r.json();
      } catch (_) {
        // try next
      }
    }
    return null;
  }

  function countTopics(graph) {
    const perTopic = {};
    let total = 0;
    for (const node of graph.nodes || []) {
      const topic = node.topic;
      if (!topic || topic === 'shiny-tutorial') continue;
      perTopic[topic] = (perTopic[topic] || 0) + 1;
      total++;
    }
    return { total, perTopic };
  }

  function hideCount(el) {
    const chip = el.closest('.count-chip, .topic-card-label');
    (chip || el).style.display = 'none';
  }

  function applyCounts({ total, perTopic }) {
    const totalEl = document.getElementById('live-total-count');
    if (totalEl) totalEl.textContent = total.toString();
    document.querySelectorAll('[data-topic-count]').forEach(el => {
      const n = perTopic[el.getAttribute('data-topic-count')];
      if (n === undefined || n === 0) return hideCount(el);
      el.textContent = n.toString();
    });
    document.querySelectorAll('[data-topic-sum]').forEach(el => {
      const slugs = el.getAttribute('data-topic-sum').split(/\s+/).filter(Boolean);
      const n = slugs.reduce((sum, slug) => sum + (perTopic[slug] || 0), 0);
      if (n === 0) return hideCount(el);
      el.textContent = n.toString();
    });
  }

  document.addEventListener('DOMContentLoaded', async () => {
    const graph = await fetchGraph();
    if (!graph) {
      // Hide everything; no numbers shown is preferable to wrong numbers
      const totalEl = document.getElementById('live-total-count');
      if (totalEl) totalEl.parentElement && (totalEl.parentElement.style.display = 'none');
      document.querySelectorAll('[data-topic-count], [data-topic-sum]').forEach(hideCount);
      return;
    }
    applyCounts(countTopics(graph));
  });
})();
</script>
